<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Lucid chat header - Safety menu mock</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#09090b; }
  .frame { width:390px; margin:0 auto; border:1px solid #27272a; }
</style>
</head>
<body class="text-zinc-100">

<!-- FRAME 1: menu closed -->
<div class="frame">
  <div class="px-4 pt-6 pb-2">
    <div class="mb-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-white/10 text-lg font-bold text-zinc-300">J</div>
        <div>
          <button class="mb-1 text-sm text-zinc-400">&#8592; Matches</button>
          <h1 class="text-xl font-bold">Jordan Michael Thompson</h1>
          <span class="mt-1 inline-flex items-center gap-1.5 text-xs">
            <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
            <span class="font-semibold text-emerald-300">Online now</span>
          </span>
          <button class="mt-1 flex items-center gap-1.5 text-xs text-emerald-300">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <span class="underline decoration-dotted underline-offset-2">End-to-end encrypted</span>
          </button>
        </div>
      </div>
      <div class="relative shrink-0">
        <button class="flex items-center gap-1.5 rounded-md border border-zinc-700 bg-zinc-900 px-3 py-2 text-xs text-zinc-100">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10z"/></svg>
          <span>Safety</span>
        </button>
      </div>
    </div>
    <div class="mb-4 flex items-center gap-2">
      <button aria-label="Video call" class="rounded-md border border-zinc-700 bg-zinc-900 p-2 text-zinc-100">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button aria-label="Voice call" class="rounded-md border border-zinc-700 bg-zinc-900 p-2 text-zinc-100">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
      </button>
    </div>
    <p class="pb-4 text-xs text-zinc-500">Frame 1: menu closed</p>
  </div>
</div>

<!-- FRAME 2: menu open -->
<div class="frame mt-6">
  <div class="px-4 pt-6 pb-2">
    <div class="mb-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-white/10 text-lg font-bold text-zinc-300">J</div>
        <div>
          <button class="mb-1 text-sm text-zinc-400">&#8592; Matches</button>
          <h1 class="text-xl font-bold">Jordan Michael Thompson</h1>
          <span class="mt-1 inline-flex items-center gap-1.5 text-xs">
            <span class="inline-block h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
            <span class="font-semibold text-emerald-300">Online now</span>
          </span>
          <button class="mt-1 flex items-center gap-1.5 text-xs text-emerald-300">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
            <span class="underline decoration-dotted underline-offset-2">End-to-end encrypted</span>
          </button>
        </div>
      </div>
      <div class="relative shrink-0">
        <button class="flex items-center gap-1.5 rounded-md border border-zinc-700 bg-zinc-900 px-3 py-2 text-xs text-zinc-100">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10z"/></svg>
          <span>Safety</span>
        </button>
        <div role="menu" aria-label="Safety options" class="absolute right-0 z-50 mt-2 w-52 overflow-hidden rounded-xl border border-zinc-700 bg-zinc-900 shadow-xl">
          <a href="#" role="menuitem" class="block px-4 py-2.5 text-sm text-zinc-200">Safety tools and tips</a>
          <button role="menuitem" class="block w-full px-4 py-2.5 text-left text-sm text-zinc-200">Report</button>
          <button role="menuitem" class="block w-full px-4 py-2.5 text-left text-sm text-zinc-200">Block</button>
          <button role="menuitem" class="block w-full px-4 py-2.5 text-left text-sm text-zinc-200">Unmatch</button>
          <button role="menuitem" class="block w-full px-4 py-2.5 text-left text-sm text-red-400">Delete chat</button>
        </div>
      </div>
    </div>
    <div class="mb-4 flex items-center gap-2">
      <button aria-label="Video call" class="rounded-md border border-zinc-700 bg-zinc-900 p-2 text-zinc-100">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </button>
      <button aria-label="Voice call" class="rounded-md border border-zinc-700 bg-zinc-900 p-2 text-zinc-100">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>
      </button>
    </div>
    <p class="pb-4 text-xs text-zinc-500">Frame 2: menu open</p>
  </div>
</div>

</body>
</html>
